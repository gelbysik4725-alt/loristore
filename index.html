<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lori Store — Ключи доступа</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Lori Store</h1>
      <p class="subtitle">Официальный магазин ключей</p>
    </header>

    <section class="pricing">
      <div class="card">
        <h3>24 часа</h3>
        <div class="price">25 ⭐</div>
        <a href="https://t.me/ТВОЙ_БОТ" class="btn">Купить</a>
      </div>
      <div class="card">
        <h3>7 дней</h3>
        <div class="price">75 ⭐</div>
        <a href="https://t.me/ТВОЙ_БОТ" class="btn">Купить</a>
      </div>
      <div class="card popular">
        <div class="badge">Популярно</div>
        <h3>30 дней</h3>
        <div class="price">125 ⭐</div>
        <a href="https://t.me/ТВОЙ_БОТ" class="btn">Купить</a>
      </div>
      <div class="card">
        <h3>Навсегда</h3>
        <div class="price">400 ⭐</div>
        <a href="https://t.me/ТВОЙ_БОТ" class="btn">Купить</a>
      </div>
    </section>

    <section class="cta">
      <a href="https://t.me/ТВОЙ_БОТ" class="btn-main">Открыть бота в Telegram</a>
    </section>

    <footer>
      <p>© 2026 Lori Store. Все права защищены.</p>
    </footer>
  </div>
</body>
</html>
